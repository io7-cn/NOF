name: CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '11.0.100'
  CONFIGURATION: Release
  SOLUTION_FILE: NOF.slnx

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore pinned workload set
      if: runner.os == 'Linux'
      run: dotnet workload restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    - name: Install MAUI workload
      if: runner.os == 'Windows'
      run: dotnet workload install maui

    - name: Install Android dependencies
      if: runner.os == 'Windows'
      run: dotnet build src/Hostings/NOF.Hosting.Maui/NOF.Hosting.Maui.csproj -t:InstallAndroidDependencies -f net11.0-android -p:AcceptAndroidSdkLicenses=True

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Verify code formatting
      if: runner.os == 'Linux'
      # The formatter needs the source-generator assemblies built above.
      env:
        Configuration: ${{ env.CONFIGURATION }}
      run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

  publish-gate:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.changes.outputs.should_publish }}
      reason: ${{ steps.changes.outputs.reason }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Check publish-relevant changes
      id: changes
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "reason=release tag" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        before="${{ github.event.before }}"
        head="${{ github.sha }}"

        if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
          before="$(git rev-parse "${head}^" 2>/dev/null || true)"
        fi

        if [[ -z "$before" ]]; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "reason=unable to determine previous commit" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        changed_files="$(git diff --name-only "$before" "$head")"
        printf '%s\n' "$changed_files"

        publish_patterns=(
          '^\.github/workflows/cd\.yml$'
          '^src/'
          '^Directory\.Build\.props$'
          '^Directory\.Build\.targets$'
          '^Directory\.Packages\.props$'
          '^Directory\.Packages\.targets$'
          '^nuget\.config$'
          '^NuGet\.config$'
          '^NOF\.slnx$'
          '^global\.json$'
        )

        while IFS= read -r file; do
          for pattern in "${publish_patterns[@]}"; do
            if [[ "$file" =~ $pattern ]]; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "reason=$file" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
        done <<< "$changed_files"

        echo "should_publish=false" >> "$GITHUB_OUTPUT"
        echo "reason=no src or build input changes" >> "$GITHUB_OUTPUT"

    - name: Report publish decision
      run: |
        echo "Should publish: ${{ steps.changes.outputs.should_publish }}"
        echo "Reason: ${{ steps.changes.outputs.reason }}"

  pack-and-publish:
    runs-on: windows-latest
    needs: [build-and-test, publish-gate]
    if: needs.publish-gate.outputs.should_publish == 'true'
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore pinned workload set
      if: runner.os == 'Linux'
      run: dotnet workload restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Install Android dependencies
      run: dotnet build src/Hostings/NOF.Hosting.Maui/NOF.Hosting.Maui.csproj -t:InstallAndroidDependencies -f net11.0-android -p:AcceptAndroidSdkLicenses=True

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -match "^refs/tags/v.*") {
          # Tag push - use tag version
          $VERSION = "${{ github.ref_name }}" -replace "^v", ""
          $IS_RELEASE = "true"
        } elseif ("${{ github.event.inputs.version }}" -ne "") {
          # Manual trigger with version input
          $VERSION = "${{ github.event.inputs.version }}"
          $IS_RELEASE = "true"
        } else {
          # Main branch push - use version from Directory.Build.props with nightly suffix
          $CONTENT = Get-Content "Directory.Build.props" -Raw
          if ($CONTENT -match '<VersionPrefix>([^<]+)</VersionPrefix>') {
            $BASE_VERSION = $matches[1]
          } else {
            $BASE_VERSION = "8.0.0"
          }
          $SHORT_SHA = git rev-parse --short HEAD
          $BASE_TIME = [DateTimeOffset]::Parse("2024-01-01T00:00:00Z").ToUnixTimeSeconds()
          $CURRENT_TIME = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $MINUTES_SINCE = [math]::Floor(($CURRENT_TIME - $BASE_TIME) / 60)
          $VERSION = "${BASE_VERSION}-nightly.${MINUTES_SINCE}.${SHORT_SHA}"
          $IS_RELEASE = "false"
        }
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "IS_RELEASE=$IS_RELEASE" >> $env:GITHUB_OUTPUT
        echo "Version: $VERSION"
        echo "Is Release: $IS_RELEASE"

    - name: Pack NuGet packages
      shell: pwsh
      run: |
        $VERSION = "${{ steps.version.outputs.VERSION }}"
        New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null

        $projectFiles = Get-ChildItem src -Recurse -Filter *.csproj | Sort-Object FullName
        $packProjects = @()

        foreach ($project in $projectFiles)
        {
          [xml]$xml = Get-Content $project.FullName -Raw
          $propertyGroups = @($xml.Project.PropertyGroup)
          $packageId = ($propertyGroups | ForEach-Object { $_.PackageId } | Where-Object { $_ } | Select-Object -First 1)
          $isPackable = ($propertyGroups | ForEach-Object { $_.IsPackable } | Where-Object { $_ } | Select-Object -First 1)

          if ([string]::IsNullOrWhiteSpace($packageId))
          {
            continue
          }

          if ($isPackable -and $isPackable.ToString().Trim().ToLowerInvariant() -eq "false")
          {
            continue
          }

          $packProjects += $project.FullName
        }

        if ($packProjects.Count -eq 0)
        {
          throw "No packable projects found under src/."
        }

        foreach ($projectPath in $packProjects)
        {
          Write-Host "Packing: $projectPath"
          dotnet pack $projectPath --configuration ${{ env.CONFIGURATION }} --no-build --output ./artifacts /p:PackageVersion=$VERSION
        }

    - name: Sign in to NuGet.org with Trusted Publishing
      id: nuget-login
      uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
      with:
        user: Shoming

    - name: Publish to NuGet.org
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        $packages = Get-ChildItem ./artifacts/*.nupkg
        foreach ($package in $packages) {
          Write-Host "Publishing: $($package.Name)"
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

    - name: Create release draft
      if: steps.version.outputs.IS_RELEASE == 'true'
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        draft: true
        prerelease: false

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-and-test
    # The github-pages environment permits main deployments, not release tags.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore pinned workload set
      if: runner.os == 'Linux'
      run: dotnet workload restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    # Build first so DocFX can read pre-built DLLs instead of .csproj files.
    # Workaround for modern C# support: https://github.com/dotnet/docfx/issues/10808
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Install DocFX
      run: dotnet tool install -g docfx

    - name: Prepare API landing page
      run: mkdir -p api && mv docs/api/index.md api/index.md

    - name: Build documentation
      run: docfx docfx.json

    - name: Install WebAssembly tools
      run: dotnet workload install wasm-tools

    - name: Publish homepage
      run: dotnet publish website/NOF.Website/NOF.Website.csproj --configuration ${{ env.CONFIGURATION }} --no-restore --output _homepage

    - name: Assemble Pages site
      shell: bash
      run: |
        set -euo pipefail
        grep -q '<base href="/" />' _homepage/wwwroot/index.html
        cp _homepage/wwwroot/index.html _homepage/wwwroot/404.html
        cp -a _homepage/wwwroot/. _site/
        touch _site/.nojekyll

    - name: Configure GitHub Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
