name: Standards

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  standards:
    name: Standards and contribution policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned standards adoption
        run: python3 .standards/.ci/check-adoption.py
      - name: Verify contribution policy
        run: python3 .ci/check-contribution.py
      - name: Verify bilingual documentation
        run: python3 .ci/check-documentation.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify maintained frontend formatting
        run: |
          npm ci --ignore-scripts
          npm run check:frontend
