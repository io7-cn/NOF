name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '11.0.100'
  CONFIGURATION: Release
  SOLUTION_FILE: NOF.slnx

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore pinned workload set
      if: runner.os == 'Linux'
      run: dotnet workload restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    - name: Install MAUI workload
      if: runner.os == 'Windows'
      run: dotnet workload install maui

    - name: Install Android dependencies
      if: runner.os == 'Windows'
      run: dotnet build src/Hostings/NOF.Hosting.Maui/NOF.Hosting.Maui.csproj -t:InstallAndroidDependencies -f net11.0-android -p:AcceptAndroidSdkLicenses=True

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    - name: Verify code formatting
      if: runner.os == 'Linux'
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Publish Native AOT smoke test
      if: runner.os == 'Linux'
      run: dotnet publish tests/NOF.Hosting.AspNetCore.AotSmoke/NOF.Hosting.AspNetCore.AotSmoke.csproj --configuration ${{ env.CONFIGURATION }} --runtime linux-x64 --output artifacts/aot-smoke

    - name: Run Native AOT smoke test
      if: runner.os == 'Linux'
      run: ./artifacts/aot-smoke/NOF.Hosting.AspNetCore.AotSmoke

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
