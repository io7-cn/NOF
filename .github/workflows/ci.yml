name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:

env:
  DOTNET_VERSION: '11.0.100'
  CONFIGURATION: Release
  SOLUTION_FILE: NOF.slnx

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore pinned workload set
      if: runner.os == 'Linux'
      run: dotnet workload restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    - name: Install MAUI workload
      if: runner.os == 'Windows'
      run: dotnet workload install maui

    - name: Install Android dependencies
      if: runner.os == 'Windows'
      run: dotnet build src/Hostings/NOF.Hosting.Maui/NOF.Hosting.Maui.csproj -t:InstallAndroidDependencies -f net11.0-android -p:AcceptAndroidSdkLicenses=True

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.CONFIGURATION }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Verify code formatting
      if: runner.os == 'Linux'
      # The formatter needs the source-generator assemblies built above.
      env:
        Configuration: ${{ env.CONFIGURATION }}
      run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Publish Native AOT smoke test
      if: runner.os == 'Linux'
      run: dotnet publish tests/NOF.Hosting.AspNetCore.AotSmoke/NOF.Hosting.AspNetCore.AotSmoke.csproj --configuration ${{ env.CONFIGURATION }} --runtime linux-x64 --output artifacts/aot-smoke

    - name: Run Native AOT smoke test
      if: runner.os == 'Linux'
      run: ./artifacts/aot-smoke/NOF.Hosting.AspNetCore.AotSmoke

    - name: Upload coverage reports
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      if: success()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false

  rabbitmq-sample:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.2@sha256:0ea64c69ef2ced52e7188c6db826152d42f78e448433ed8b4e570170c427a437
        env:
          RABBITMQ_DEFAULT_USER: nof-demo
          RABBITMQ_DEFAULT_PASS: nof-demo-local
        ports:
        - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Verify real RabbitMQ queue, fanout and offline recovery
      env:
        NOF_SAMPLE_RABBITMQ: Host=localhost;Port=5672;UserName=nof-demo;Password=nof-demo-local;VirtualHost=/
      run: dotnet test sample-tests/NOF.Sample.Tests/NOF.Sample.Tests.csproj --configuration ${{ env.CONFIGURATION }} --filter FullyQualifiedName~RabbitMQDispatchTests --logger "trx;LogFileName=rabbitmq-live.trx" --results-directory artifacts/rabbitmq-tests
